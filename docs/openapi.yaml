  responses:
    E400:
      description: 'Solicitud inválida. La petición está mal formada: JSON roto, campo obligatorio ausente, tipo
        incorrecto o parámetro fuera de rango.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: VALIDACION_FALLIDA
              mensaje: Los datos enviados no son válidos.
              detalles:
              - campo: fin
                problema: Es obligatorio
              ruta: /api/v1/reservas
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E401:
      description: No autenticado. Falta el token, expiró o no es válido; o las credenciales del inicio de sesión
        son incorrectas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: TOKEN_INVALIDO
              mensaje: El token no es válido o expiró. Inicie sesión de nuevo.
              ruta: /api/v1/reservas
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E403:
      description: Sin permiso. El usuario está autenticado, pero su rol o su propiedad sobre el registro no permiten
        la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: PERMISO_INSUFICIENTE
              mensaje: Su rol no permite realizar esta operación.
              ruta: /api/v1/usuarios/5
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E404:
      description: No encontrado. El recurso indicado en la ruta no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: NO_ENCONTRADO
              mensaje: No existe un recurso con el identificador 9999.
              ruta: /api/v1/recursos/9999
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E409:
      description: 'Conflicto. La operación choca con el estado actual: reserva traslapada, correo o código de inventario
        repetidos, estado incompatible.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: RESERVA_TRASLAPADA
              mensaje: El recurso ya está reservado en ese horario.
              detalles:
              - campo: inicio
                problema: Se traslapa con la reserva 31
              ruta: /api/v1/reservas
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E422:
      description: 'Regla de negocio incumplida. La petición está bien formada, pero viola una regla: límite de
        reservas, usuario sancionado, recurso no reservable, fuera de plazo.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: LIMITE_RESERVAS_EXCEDIDO
              mensaje: Alcanzó el límite de reservas vigentes de su rol (2).
              ruta: /api/v1/reservas
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E429:
      description: Demasiadas peticiones. El Gateway limitó la cantidad de peticiones de un mismo cliente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Servicio no disponible. Un servicio del que depende la operación no respondió.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              codigo: SERVICIO_NO_DISPONIBLE
              mensaje: No fue posible verificar el recurso. Intente de nuevo en unos minutos.
              ruta: /api/v1/reservas
              fecha: '2026-11-02T18:40:12-06:00'
              idPeticion: req-7f3a91c2
    E500:
      description: Error interno. Falla inesperada del servicio; el mensaje no revela detalles internos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
