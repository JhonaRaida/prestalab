openapi: 3.0.3
info:
  title: PrestaLab API
  version: 1.0.0-borrador
  description: Borrador de la API de PrestaLab (Entrega 3). Todas las rutas pasan por el API Gateway. Las rutas
    /internal/v1 son solo entre servicios y no se publican.
servers:
- url: http://localhost:8080/api/v1
  description: Gateway local (Docker Compose)
tags:
- name: Usuarios
  description: Usuarios y Autenticación
- name: Inventario
  description: Laboratorios, categorías y recursos
- name: Reservas
  description: Reservas y Préstamos
- name: Notificaciones
  description: Avisos a usuarios
- name: Reportes
  description: Reportes de solo lectura
security:
- bearerAuth: []
paths:
  /sesiones:
    post:
      tags:
      - Usuarios
      summary: Iniciar sesión y obtener token
      operationId: E01post
      description: 'Acceso: Público. Requisito: RF-01.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionCrear'
            example:
              correo: ana.lopez@ejemplo.edu.mx
              contrasena: Contrasena#2026
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
              example:
                tokenAcceso: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                tipo: Bearer
                expiraEn: 3600
                usuario:
                  id: 12
                  nombre: Ana López Ruiz
                  rol: alumno
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
  /usuarios:
    post:
      tags:
      - Usuarios
      summary: Registrar un usuario
      operationId: E02post
      description: 'Acceso: Público. Requisito: RF-01.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
            example:
              nombre: Ana López Ruiz
              correo: ana.lopez@ejemplo.edu.mx
              matricula: '023000123'
              contrasena: Contrasena#2026
              rol: alumno
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                id: 12
                nombre: Ana López Ruiz
                correo: ana.lopez@ejemplo.edu.mx
                matricula: '023000123'
                rol: alumno
                estado: activo
                creadoEn: '2026-11-02T18:30:00-06:00'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
    get:
      tags:
      - Usuarios
      summary: Listar usuarios
      operationId: E03get
      description: 'Acceso: Administrador. Requisito: RF-02.'
      x-roles: &id002
      - administrador
      parameters:
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      - $ref: '#/components/parameters/q_rol'
      - $ref: '#/components/parameters/q_estadoUsuario'
      - $ref: '#/components/parameters/q_q'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioLista'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '500':
          $ref: '#/components/responses/E500'
  /usuarios/{usuarioId}:
    get:
      tags:
      - Usuarios
      summary: Consultar un usuario
      operationId: E04get
      description: 'Acceso: Administrador; el propio usuario. Requisito: RF-02.'
      x-roles: &id001
      - alumno
      - docente
      - encargado
      - administrador
      parameters:
      - $ref: '#/components/parameters/path_usuarioId'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    patch:
      tags:
      - Usuarios
      summary: Cambiar rol, estado o nombre
      operationId: E05patch
      description: 'Acceso: Administrador; el propio usuario (solo nombre). Requisito: RF-02.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/path_usuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /usuarios/{usuarioId}/sanciones:
    get:
      tags:
      - Usuarios
      summary: Consultar sanciones de un usuario
      operationId: E06get
      description: 'Acceso: Administrador; el propio usuario. Requisito: RF-07.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/path_usuarioId'
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SancionLista'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /laboratorios:
    get:
      tags:
      - Inventario
      summary: Listar laboratorios
      operationId: E07get
      description: 'Acceso: Autenticado. Requisito: RF-03.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratorioLista'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Inventario
      summary: Crear un laboratorio
      operationId: E08post
      description: 'Acceso: Administrador. Requisito: RF-03.'
      x-roles: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaboratorioEntrada'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Laboratorio'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
  /laboratorios/{laboratorioId}:
    get:
      tags:
      - Inventario
      summary: Consultar un laboratorio
      operationId: E09get
      description: 'Acceso: Autenticado. Requisito: RF-03.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/path_laboratorioId'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Laboratorio'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    put:
      tags:
      - Inventario
      summary: Reemplazar los datos de un laboratorio
      operationId: E10put
      description: 'Acceso: Administrador. Requisito: RF-03.'
      x-roles: *id002
      parameters:
      - $ref: '#/components/parameters/path_laboratorioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaboratorioEntrada'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Laboratorio'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
  /categorias:
    get:
      tags:
      - Inventario
      summary: Listar categorías
      operationId: E11get
      description: 'Acceso: Autenticado. Requisito: RF-03.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      - $ref: '#/components/parameters/q_tipoRecurso'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaLista'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Inventario
      summary: Crear una categoría
      operationId: E12post
      description: 'Acceso: Administrador. Requisito: RF-03.'
      x-roles: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaEntrada'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
  /recursos:
    get:
      tags:
      - Inventario
      summary: Listar y filtrar recursos
      operationId: E13get
      description: 'Acceso: Autenticado. Requisito: RF-03.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      - $ref: '#/components/parameters/q_laboratorioId'
      - $ref: '#/components/parameters/q_categoriaId'
      - $ref: '#/components/parameters/q_tipoRecurso'
      - $ref: '#/components/parameters/q_estadoRecurso'
      - $ref: '#/components/parameters/q_q'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoLista'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '500':
          $ref: '#/components/responses/E500'
    post:
      tags:
      - Inventario
      summary: Crear un recurso
      operationId: E14post
      description: 'Acceso: Encargado (su laboratorio); administrador. Requisito: RF-03.'
      x-roles: &id003
      - encargado
      - administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoEntrada'
            example:
              nombre: Osciloscopio digital de 4 canales
              codigoInventario: LAB-ELEC-0015
              categoriaId: 3
              laboratorioId: 2
              descripcion: 100 MHz
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurso'
              example:
                id: 15
                nombre: Osciloscopio digital de 4 canales
                codigoInventario: LAB-ELEC-0015
                categoriaId: 3
                laboratorioId: 2
                descripcion: 100 MHz
                estado: activo
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '500':
          $ref: '#/components/responses/E500'
  /recursos/{recursoId}:
    get:
      tags:
      - Inventario
      summary: Consultar un recurso
      operationId: E15get
      description: 'Acceso: Autenticado. Requisito: RF-03.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/path_recursoId'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurso'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    put:
      tags:
      - Inventario
      summary: Reemplazar los datos de un recurso
      operationId: E16put
      description: 'Acceso: Encargado (su laboratorio); administrador. Requisito: RF-03.'
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/path_recursoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoEntrada'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurso'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '500':
          $ref: '#/components/responses/E500'
    patch:
      tags:
      - Inventario
      summary: Cambiar el estado (activo, mantenimiento, baja)
      operationId: E17patch
      description: 'Acceso: Encargado (su laboratorio); administrador. Requisito: RF-03.'
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/path_recursoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoEstado'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurso'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    delete:
      tags:
      - Inventario
      summary: Dar de baja un recurso (baja lógica)
      operationId: E18delete
      description: 'Acceso: Encargado (su laboratorio); administrador. Requisito: RF-03.'
      x-roles: *id003
      parameters:
      - $ref: '#/components/parameters/path_recursoId'
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '500':
          $ref: '#/components/responses/E500'
  /disponibilidad:
    get:
      tags:
      - Reservas
      summary: Consultar recursos disponibles en un horario
      operationId: E19get
      description: 'Acceso: Autenticado. Requisito: RF-04.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/q_inicio'
      - $ref: '#/components/parameters/q_fin'
      - $ref: '#/components/parameters/q_tipoRecurso'
      - $ref: '#/components/parameters/q_laboratorioId'
      - $ref: '#/components/parameters/q_categoriaId'
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoDisponibleLista'
              example:
                data:
                - recursoId: 15
                  nombre: Osciloscopio digital de 4 canales
                  tipo: equipo
                  laboratorioId: 2
                  inicio: '2026-11-03T10:00:00-06:00'
                  fin: '2026-11-03T12:00:00-06:00'
                - recursoId: 18
                  nombre: Multímetro de banco
                  tipo: equipo
                  laboratorioId: 2
                  inicio: '2026-11-03T10:00:00-06:00'
                  fin: '2026-11-03T12:00:00-06:00'
                meta:
                  page: 1
                  limit: 20
                  total: 2
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '503':
          $ref: '#/components/responses/E503'
        '500':
          $ref: '#/components/responses/E500'
  /reservas:
    post:
      tags:
      - Reservas
      summary: Crear una reserva
      operationId: E20post
      description: 'Acceso: Alumno, docente; encargado (mostrador). Requisito: RF-05.'
      x-roles:
      - alumno
      - docente
      - encargado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCrear'
            example:
              recursoId: 15
              inicio: '2026-11-03T10:00:00-06:00'
              fin: '2026-11-03T12:00:00-06:00'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
              example:
                id: 31
                usuarioId: 12
                recursoId: 15
                inicio: '2026-11-03T10:00:00-06:00'
                fin: '2026-11-03T12:00:00-06:00'
                estado: confirmada
                creadaEn: '2026-11-02T18:35:00-06:00'
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
        '500':
          $ref: '#/components/responses/E500'
    get:
      tags:
      - Reservas
      summary: Consultar historial de reservas
      operationId: E21get
      description: 'Acceso: Alumno, docente (propias); encargado (su laboratorio); administrador. Requisito: RF-09.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/q_page'
      - $ref: '#/components/parameters/q_limit'
      - $ref: '#/components/parameters/q_usuarioId'
      - $ref: '#/components/parameters/q_recursoId'
      - $ref: '#/components/parameters/q_estadoReserva'
      - $ref: '#/components/parameters/q_desde'
      - $ref: '#/components/parameters/q_hasta'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaLista'
              example:
                data:
                - id: 30
                  usuarioId: 12
                  recursoId: 18
                  inicio: '2026-10-27T09:00:00-06:00'
                  fin: '2026-10-27T11:00:00-06:00'
                  estado: finalizada
                  creadaEn: '2026-10-26T17:00:00-06:00'
                - id: 22
                  usuarioId: 12
                  recursoId: 15
                  inicio: '2026-10-20T10:00:00-06:00'
                  fin: '2026-10-20T12:00:00-06:00'
                  estado: finalizada
                  creadaEn: '2026-10-19T16:20:00-06:00'
                meta:
                  page: 1
                  limit: 2
                  total: 5
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '500':
          $ref: '#/components/responses/E500'
  /reservas/{reservaId}:
    get:
      tags:
      - Reservas
      summary: Consultar una reserva
      operationId: E22get
      description: 'Acceso: Dueño de la reserva; encargado; administrador. Requisito: RF-09.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/path_reservaId'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '500':
          $ref: '#/components/responses/E500'
    patch:
      tags:
      - Reservas
      summary: Modificar el horario o cancelar la reserva
      operationId: E23patch
      description: 'Acceso: Dueño de la reserva; encargado; administrador. Requisito: RF-05.'
      x-roles: *id001
      parameters:
      - $ref: '#/components/parameters/path_reservaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaActualizar'
