components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    path_usuarioId:
      name: usuarioId
      in: path
      required: true
      description: Identificador del usuario
      schema:
        type: integer
        minimum: 1
    path_laboratorioId:
      name: laboratorioId
      in: path
      required: true
      description: Identificador del laboratorio
      schema:
        type: integer
        minimum: 1
    path_recursoId:
      name: recursoId
      in: path
      required: true
      description: Identificador del recurso
      schema:
        type: integer
        minimum: 1
    path_reservaId:
      name: reservaId
      in: path
      required: true
      description: Identificador de la reserva
      schema:
        type: integer
        minimum: 1
    path_prestamoId:
      name: prestamoId
      in: path
      required: true
      description: Identificador del préstamo
      schema:
        type: integer
        minimum: 1
    path_notificacionId:
      name: notificacionId
      in: path
      required: true
      description: Identificador de la notificación
      schema:
        type: integer
        minimum: 1
    q_page:
      name: page
      in: query
      required: false
      description: Número de página
      schema:
        type: integer
        minimum: 1
        default: 1
    q_limit:
      name: limit
      in: query
      required: false
      description: Elementos por página (máximo 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    q_rol:
      name: rol
      in: query
      required: false
      description: Filtrar por rol
      schema:
        type: string
        enum: &id004
        - alumno
        - docente
        - encargado
        - administrador
    q_estadoUsuario:
      name: estado
      in: query
      required: false
      description: Filtrar por estado de cuenta
      schema:
        type: string
        enum:
        - activo
        - bloqueado
    q_estadoRecurso:
      name: estado
      in: query
      required: false
      description: Filtrar por estado del recurso
      schema:
        type: string
        enum:
        - activo
        - mantenimiento
        - baja
    q_estadoReserva:
      name: estado
      in: query
      required: false
      description: Filtrar por estado de la reserva
      schema:
        type: string
        enum:
        - confirmada
        - cancelada
        - en_curso
        - finalizada
    q_estadoIncidencia:
      name: estado
      in: query
      required: false
      description: Filtrar por estado de la incidencia
      schema:
        type: string
        enum:
        - abierta
        - cerrada
    q_q:
      name: q
      in: query
      required: false
      description: Texto a buscar en el nombre
      schema:
        type: string
    q_laboratorioId:
      name: laboratorioId
      in: query
      required: false
      description: Filtrar por laboratorio
      schema:
        type: integer
        minimum: 1
    q_categoriaId:
      name: categoriaId
      in: query
      required: false
      description: Filtrar por categoría
      schema:
        type: integer
        minimum: 1
    q_tipoRecurso:
      name: tipo
      in: query
      required: false
      description: Tipo de recurso
      schema:
        type: string
        enum:
        - equipo
        - espacio
    q_tipoIncidencia:
      name: tipo
      in: query
      required: false
      description: Tipo de incidencia
      schema:
        type: string
        enum:
        - dano
        - faltante
        - retraso
    q_usuarioId:
      name: usuarioId
      in: query
      required: false
      description: Filtrar por usuario
      schema:
        type: integer
        minimum: 1
    q_recursoId:
      name: recursoId
      in: query
      required: false
      description: Filtrar por recurso
      schema:
        type: integer
        minimum: 1
    q_inicio:
      name: inicio
      in: query
      required: true
      description: Inicio del horario consultado (ISO 8601)
      schema:
        type: string
        format: date-time
    q_fin:
      name: fin
      in: query
      required: true
      description: Fin del horario consultado (ISO 8601)
      schema:
        type: string
        format: date-time
    q_desde:
      name: desde
      in: query
      required: false
      description: Inicio del periodo (ISO 8601)
      schema:
        type: string
        format: date-time
    q_hasta:
      name: hasta
      in: query
      required: false
      description: Fin del periodo (ISO 8601)
      schema:
        type: string
        format: date-time
    q_desdeReq:
      name: desde
      in: query
      required: true
      description: Inicio del periodo (ISO 8601)
      schema:
        type: string
        format: date-time
    q_hastaReq:
      name: hasta
      in: query
      required: true
      description: Fin del periodo (ISO 8601)
      schema:
        type: string
        format: date-time
    q_leida:
      name: leida
      in: query
      required: false
      description: Filtrar por notificaciones leídas o no leídas
      schema:
        type: boolean
  schemas:
    Meta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - page
      - limit
      - total
      description: Datos de paginación
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo:
              type: string
              description: Código de aplicación estable, en MAYÚSCULAS
            mensaje:
              type: string
              description: Mensaje legible, sin información interna
            detalles:
              type: array
              items:
                type: object
                properties:
                  campo:
                    type: string
                  problema:
                    type: string
                required:
                - problema
            ruta:
              type: string
            fecha:
              type: string
              format: date-time
            idPeticion:
              type: string
              description: Identificador de la petición, asignado por el Gateway
          required:
          - codigo
          - mensaje
          - ruta
          - fecha
          - idPeticion
      required:
      - error
